id = "readme"

[[sections]]
heading = "stringline"
body = '''
A public build, in progress. Two tools run from a clone; neither is released yet.
'''

[[sections]]
heading = "What it is"
body = '''
Three things, in one repository:

- **A tool.** Small instruments recreated from my own way of working with AI agents, starting with one that checks every quote of a person's own words against what that person actually typed, and says exact, corrected, absent or can't check. Its second half pulls the typed messages out of an AI session's record. Where a tool checks what an agent said, it says what it looked at, and says "can't tell" rather than "clean" when it cannot see.
- **A build, told through its sessions and its code.** Built in public from the first commit: intent before anything, direction before code, work done by agents under written instructions, every spec reviewed by a separate reviewer (another AI agent, or a person) that did not write it, and a dated log of each decision and each wrong turn caught.
- **A manual you walk.** A clean, structured surface: one card per released tool, a walk through the record, and how the work runs. Its pages are built from one source that also writes this README. To read it, open [site/index.html](site/index.html) in a browser from a clone.

The full intent, in my words, is [INTENT.md](INTENT.md). Where any file here disagrees with it, the intent governs.
'''

[[sections]]
heading = "Where it stands"
body = '''
Founded on 7 October 2026. It holds the intent, the files that say how the work runs, an entry of the build log for each session, the map of what depends on what ([MAP.md](MAP.md)), the specification ([SPEC.md](SPEC.md) and its nine parts), and what has been built from it: two tools, the five checks that guard the repository, and a workflow that runs every check and every self-test on each push. Both tools are marked `building`, not released. The first checks every quote of a person's own words against what that person typed, and its second half pulls those typed words out of an AI session's record; the second checks a finished list and also runs as a hook. I have run each on my own material, and each caught something. Run on my own records, the first tool read two quotes in the intent as absent: both end in "…" where my message went on, and the build log says why. Run from this folder it reads them corrected, because [WORDS.txt](WORDS.txt) holds only the quoted words. My first run of it also exposed a fault in the tool itself, which was fixed the same day. The second read one line of a closed list as malformed. To see the first tool work from a clone: `python3 tools/your-words/your_words.py --selftest --no-log` (Python 3.11 or later, and git). The manual has its look. The walk through the record and the first released card come next, and nothing is released until I say so. [WORDS.txt](WORDS.txt) holds my typed lines that the intent and LEARNED.md quote, one block per quoted span and nothing else; a reply I gave twice appears twice.
'''

[[sections]]
heading = "Read in this order"
body = '''
1. [INTENT.md](INTENT.md): what this is, why, and where it is going.
2. [BUILD-LOG.md](BUILD-LOG.md): what each session did, decided and got wrong, dated.
3. [LEARNED.md](LEARNED.md): what I learned, in my own words, each session.
4. [DECISIONS.md](DECISIONS.md): each decision and its reason.
5. [MAP.md](MAP.md) and [SPEC.md](SPEC.md): the order of the work, and the specification each part was built from.
6. [OPEN-PROTOCOL.md](OPEN-PROTOCOL.md): how a working session opens and closes, and what waits for my word.
7. [CLAUDE.md](CLAUDE.md): the instructions any AI agent working in this repository follows.
'''

[[sections]]
heading = "Who builds it"
body = '''
I'm {owner}, and I direct it; the other files call me "the owner". Claude Code, Anthropic's AI coding tool, writes the implementation under my direction and review, and the record says which is which. Each session names the Claude model it ran on. **Licence.** The font files in `site/fonts/` and `manual/look/fonts/` are not under this repository's MIT licence ([LICENSE](LICENSE)): each carries its own, the SIL Open Font License 1.1, with its full text and copyright notice beside it ([site/fonts/NOTICE.txt](site/fonts/NOTICE.txt)).
'''

[[sections]]
heading = "What stays out"
body = '''
The working notes live in a private folder beside this one (`../stringline-private`). Nothing moves from there into this repository without being rewritten for a reader here. No client, no other person and no private project is named, and before anything is pushed, a check refuses any push that carries a word from a private list.
'''
